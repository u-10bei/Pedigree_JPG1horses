<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日本G1勝ち馬の父系図</title>
  <meta name="description" content="日本の G1 勝ち馬（旧八大競走・ジャパンカップを含む）の父系を三大始祖からたどる階層図">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1>日本G1勝ち馬の父系図</h1>
    <p class="summary" id="summary">読み込み中…</p>
  </header>

  <section class="toolbar" aria-label="操作">
    <div class="search">
      <label for="search">馬名で探す</label>
      <input id="search" type="search" list="horse-names" placeholder="例：ディープインパクト" autocomplete="off">
      <datalist id="horse-names"></datalist>
    </div>
    <div class="buttons">
      <button type="button" id="expand-major">主要な系統を開く</button>
      <button type="button" id="expand-all">すべて開く</button>
      <button type="button" id="collapse-all">すべて閉じる</button>
      <label class="toggle"><input type="checkbox" id="show-chain"> 中継ぎの祖先も表示</label>
    </div>
  </section>

  <section class="legend" id="legend" aria-label="系統の凡例"></section>

  <main class="chart" id="chart">
    <svg id="tree" role="img" aria-labelledby="tree-desc"><desc id="tree-desc">三大始祖から G1 勝ち馬までの父系の階層図。円の大きさは G1 勝利数、色は系統を表します。</desc></svg>
    <div class="tooltip" id="tooltip" role="status" hidden></div>
    <p class="hint">ドラッグで移動、ホイール・ピンチで拡大縮小。● をクリックすると子孫を開閉します。<span class="dashed-sample"></span> は子が 1 頭だけで G1 を勝っていない祖先を省略した区間です。</p>
  </main>

  <details class="table-view">
    <summary>勝ち馬の一覧（表）</summary>
    <div class="table-wrap">
      <table id="winners">
        <thead><tr><th>馬名</th><th>生年</th><th>父</th><th>系統</th><th class="num">G1</th><th>勝ったレース</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </details>

  <footer class="page-footer">
    <p>データ出典：Wikipedia（<a href="https://creativecommons.org/licenses/by-sa/4.0/deed.ja">CC BY-SA 4.0</a>）各レース記事の「歴代優勝馬」、<a href="https://www.wikidata.org/">Wikidata</a>（CC0）。対象：1983 年までの旧八大競走、ジャパンカップ、1984 年以降の平地 G1（J・G1 を除く）。</p>
    <p><a href="https://github.com/u-10bei/Pedigree_JPG1horses">GitHub リポジトリ</a></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
