[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pedigree-jpg1horses"
version = "0.1.0"
description = "日本の G1 勝ち馬の父系を階層図にする"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
fetch = ["requests>=2.31", "beautifulsoup4>=4.12"]
admin = ["streamlit>=1.50"]

[tool.setuptools.packages.find]
include = ["pedigree*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
